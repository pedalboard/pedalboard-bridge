name: CI
on: [push]
env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: sudo apt-get install -y libjack-jackd2-dev
      - run: cargo fmt -- --check
      - run: cargo clippy -- -D warnings
      - run: cargo build --release
      - run: cargo test --lib

  build-arm64:
    runs-on: ubuntu-24.04-arm
    container:
      image: debian:bookworm
      env:
        HOME: /root
        RUSTUP_HOME: /root/.rustup
        CARGO_HOME: /root/.cargo
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install dependencies
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends \
            curl ca-certificates build-essential pkg-config git \
            libjack-jackd2-dev libssl-dev debhelper dpkg-dev
          git config --global --add safe.directory "*"
      - name: Install Rust
        run: |
          export HOME=/root RUSTUP_HOME=/root/.rustup CARGO_HOME=/root/.cargo
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
      - name: Build
        env:
          GIT_HASH: ${{ github.sha }}
          HOME: /root
          RUSTUP_HOME: /root/.rustup
          CARGO_HOME: /root/.cargo
        run: /root/.cargo/bin/cargo build --release
      - name: Rename binary for release
        run: cp target/release/pedalboard-bridge target/release/pedalboard-bridge-arm64

      - name: Build .deb
        run: |
          cp target/release/pedalboard-bridge pedalboard-bridge
          dpkg-buildpackage -us -uc -b
          mkdir -p dist
          mv ../pedalboard-bridge_*.deb dist/
          cp target/release/pedalboard-bridge-arm64 dist/

      - uses: actions/upload-artifact@v4
        with:
          name: pedalboard-bridge-arm64
          path: |
            dist/pedalboard-bridge_*.deb
            dist/pedalboard-bridge-arm64

      - name: Publish rolling latest release (main branch)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest (main)
          prerelease: true
          files: |
            dist/pedalboard-bridge_*.deb
            dist/pedalboard-bridge-arm64

      - name: Publish versioned release (tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/pedalboard-bridge_*.deb
            dist/pedalboard-bridge-arm64
